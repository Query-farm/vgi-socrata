# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with check_sql.
# See https://github.com/Query-farm/vgi-lint-check (VGI920).
# All tasks but quote_literal read live Socrata portals, so they grade with check_sql.
tasks:
  - name: nyc_311_dataset_id
    check_sql: >-
      SELECT count(*) = 1 FROM socrata.main.datasets('data.cityofnewyork.us', q := '311 service requests')
      WHERE dataset_id = 'erm2-nwe9' AND title = '311 Service Requests from 2020 to Present'
  - name: nyc_311_brooklyn_first_minutes
    check_sql: >-
      SELECT count(*) = 10 FROM socrata.main.dataset('data.cityofnewyork.us', 'erm2-nwe9')
      WHERE created_date >= TIMESTAMP '2024-01-01 00:00:00' AND created_date < TIMESTAMP '2024-01-01 00:05:00'
        AND borough = 'BROOKLYN'
  - name: chicago_library_count
    check_sql: SELECT count(*) = 82 FROM socrata.main.dataset('data.cityofchicago.org', 'x8fc-8rcq')
  - name: nyc_311_created_date_type
    check_sql: >-
      SELECT data_type = 'calendar_date' FROM socrata.main.dataset_columns('data.cityofnewyork.us', 'erm2-nwe9')
      WHERE field_name = 'created_date'
  - name: quote_literal
    reference_sql: SELECT socrata.main.soql_quote('O''Brien') AS literal
